project:
  type: website
  output-dir: docs
  # Render every .qmd in the project root (folders starting with "_",
  # e.g. _website_ignore/, are skipped automatically)
  render:
    - "*.qmd"

execute:
  # Only re-run code when a document's source changes. Results are stored
  # in _freeze/, so the site can be rebuilt without the (git-ignored) data.
  freeze: auto

website:
  title: "Wedge-tailed eagle modelling"
  favicon: icons/wedgie_silhouette.svg
  description: "Modelling the behaviours and energy landscape of wedge-tailed eagles in Tasmania"
  site-url: https://swforrest.github.io/wedgie_modelling/
  repo-url: https://github.com/swforrest/wedgie_modelling
  repo-actions: [source]
  page-navigation: true
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
        
      - text: "Behavioural Classification"
        menu:
        - href: classification_kmeans_instantaneous.qmd
          text: "K-means Instantaneous Variables"
        - href: classification_kmeans_aggregated.qmd
          text: "K-means Aggregated Variables"
        - href: classification_kmeans_combined.qmd
          text: "K-means Combined Variables"
        - href: classification_hmm.qmd
          text: "Hidden Markov Models"
        - href: classification_EMbC_aggregated.qmd
          text: "EMbC Aggregated Variables"
        - href: classification_agreement.qmd
          text: "Agreement Between Methods"

      - text: "Energy Landscape"
        menu:
        # items with only 'text' are section headers, and "---" is a divider line
        - text: "Data"
        - href: energy_harvesting_data_prep.qmd
          text: "Preparing Behavioural Bouts"
        - text: "---"
        - text: "Models"
        - href: energy_harvesting_random_forest.qmd
          text: "Random Forest"
        # uncomment and fill in as the prediction scripts are added
        # - text: "---"
        # - text: "Predictions"
        # - href: energy_landscape_predictions.qmd
        #   text: "Energy Landscape Predictions"

    right:
      - icon: github
        href: https://github.com/swforrest/wedgie_modelling
        aria-label: GitHub
  page-footer:
    left: "Scott Forrest & James Pay"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
